<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReTeX — two-way preview playground</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #0b1220;
        --line: #1f2937;
        --fg: #e5e7eb;
        --muted: #94a3b8;
        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.18);
        --accent-line: rgba(124, 58, 237, 0.55);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
      }
      header.bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header.bar h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      header.bar h1 span { color: var(--accent); }
      header.bar .hint { color: var(--muted); font-size: 12.5px; }
      header.bar .spacer { flex: 1; }
      header.bar label { color: var(--muted); font-size: 12.5px; }
      header.bar select {
        background: var(--panel-2);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
        font: inherit;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
      }
      .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .pane + .pane { border-left: 1px solid var(--line); }
      .pane .pane-head {
        padding: 7px 14px;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--muted);
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .pane .pane-head .tag {
        margin-left: auto;
        color: var(--accent);
        text-transform: none;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
        min-height: 1em;
      }
      /* Code editor */
      #code {
        flex: 1;
        resize: none;
        border: 0;
        outline: none;
        padding: 16px;
        background: var(--panel);
        color: #d1d5db;
        font: 13.5px/1.7 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
        tab-size: 2;
        white-space: pre;
        overflow: auto;
      }
      #code::selection { background: var(--accent-soft); }
      #code.flash { animation: codeflash 0.5s ease; }
      @keyframes codeflash {
        from { background: #1a1033; }
        to { background: var(--panel); }
      }
      /* Preview */
      #preview-scroll { flex: 1; overflow: auto; background: #e2e8f0; padding: 28px; }
      #preview {
        background: #fff;
        color: #111;
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 44px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      /* Two-way sync affordances on the rendered resume */
      #preview [data-rtx-pos] { cursor: pointer; border-radius: 3px; transition: background 0.12s ease, box-shadow 0.12s ease; }
      #preview [data-rtx-pos]:hover { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
      #preview .rtx-sync-active {
        background: var(--accent-soft) !important;
        box-shadow: 0 0 0 2px var(--accent-line) !important;
      }
      .err {
        margin: auto;
        max-width: 520px;
        background: #1f1330;
        border: 1px solid var(--accent-line);
        color: var(--fg);
        border-radius: 10px;
        padding: 20px 22px;
      }
      .err code { color: #c4b5fd; }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>Re<span>TeX</span> · two-way preview</h1>
      <span class="hint">Click the preview → jumps in code · Move the caret → highlights the preview</span>
      <span class="spacer"></span>
      <label for="theme">Theme</label>
      <select id="theme">
        <option value="default">default</option>
        <option value="modern">modern</option>
        <option value="classic">classic</option>
        <option value="compact">compact</option>
      </select>
    </header>

    <main>
      <section class="pane">
        <div class="pane-head">Source <span class="tag" id="code-tag"></span></div>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </section>
      <section class="pane">
        <div class="pane-head">Preview <span class="tag" id="preview-tag"></span></div>
        <div id="preview-scroll"><div id="preview"></div></div>
      </section>
    </main>

    <!-- Theme stylesheet for the rendered resume is injected here at runtime. -->
    <style id="resume-style"></style>

    <script type="module">
      // The playground consumes the *built* library, so run `npm run build`
      // first (the `npm run playground` script does this for you).
      let lib;
      try {
        lib = await import("../dist/index.js");
      } catch (e) {
        document.getElementById("preview").innerHTML =
          '<div class="err"><strong>Could not load the ReTeX bundle.</strong><br><br>' +
          "Build it and serve over http first:<br><br>" +
          "<code>npm run build</code><br><code>npm run playground</code><br><br>" +
          "(ES module imports don't work from <code>file://</code> — use the dev server.)</div>";
        throw e;
      }

      const {
        ReTeXEngine,
        getTheme,
        closestSourcePos,
        pickElementForOffset,
        readSourceType,
        SOURCE_POS_ATTR,
      } = lib;

      const codeEl = document.getElementById("code");
      const previewEl = document.getElementById("preview");
      const styleEl = document.getElementById("resume-style");
      const themeSel = document.getElementById("theme");
      const codeTag = document.getElementById("code-tag");
      const previewTag = document.getElementById("preview-tag");

      const SAMPLE = String.raw`\name{Grace Hopper}
\title{Distinguished Engineer \& Compiler Pioneer}
\email{grace@example.com}
\location{Arlington, VA}
\website{https://gracehopper.dev}

\section{Summary}
Systems engineer with 30+ years building compilers and developer
tools. Coined the term \emph{debugging}. Reduced batch latency by 60%.

\section{Experience}
\job{title=Distinguished Engineer, company=US Navy, start=1959, end=1986}{
  \begin{itemize}
    \item Led development of \textbf{COBOL}, the first English-like
      programming language.
    \item Built the first compiler, \textbf{A-0}.
  \end{itemize}
}

\job{title=Senior Mathematician, company=Eckert--Mauchly, start=1949, end=1959}{
  Programmed the UNIVAC I; pioneered machine-independent programming.
}

\section{Education}
\education{school=Yale University, degree=PhD Mathematics, start=1930, end=1934}

\section{Skills}
\skills{Compilers, COBOL, Systems Programming, Mentorship}`;

      let engine = new ReTeXEngine({ theme: getTheme(themeSel.value) });

      /* ----------------------------- render ----------------------------- */

      let activeEl = null;
      function clearActive() {
        if (activeEl) activeEl.classList.remove("rtx-sync-active");
        activeEl = null;
      }

      function render() {
        styleEl.textContent = engine.styles();
        // `sourceMap: true` stamps every element with data-rtx-pos="start:end".
        previewEl.innerHTML = engine.toHtml(codeEl.value, { sourceMap: true });
        activeEl = null;
        syncFromCaret(); // keep the caret↔preview highlight fresh after a recompile
      }

      let renderTimer = 0;
      function scheduleRender() {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(render, 120);
      }

      /* --------------- forward sync: code caret → preview --------------- */

      function syncFromCaret() {
        const offset = codeEl.selectionStart;
        const el = pickElementForOffset(
          previewEl.querySelectorAll("[" + SOURCE_POS_ATTR + "]"),
          offset,
        );
        if (el === activeEl) return;
        clearActive();
        if (el) {
          el.classList.add("rtx-sync-active");
          activeEl = el;
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
          previewTag.textContent = describe(el);
        } else {
          previewTag.textContent = "";
        }
      }

      /* --------------- reverse sync: preview click → code --------------- */

      previewEl.addEventListener("click", (event) => {
        const span = closestSourcePos(event.target);
        if (!span) return;
        codeEl.focus();
        codeEl.setSelectionRange(span.start, span.end);
        scrollCodeTo(span.start);
        flashCode();
        // Reflect the same element as active on both sides.
        clearActive();
        const hit = event.target.closest("[" + SOURCE_POS_ATTR + "]");
        if (hit) {
          hit.classList.add("rtx-sync-active");
          activeEl = hit;
          previewTag.textContent = describe(hit);
        }
        codeTag.textContent = span.start + "–" + span.end;
      });

      /* ------------------------------ helpers --------------------------- */

      function describe(el) {
        const t = readSourceType(el) || el.tagName.toLowerCase();
        const pos = el.getAttribute(SOURCE_POS_ATTR) || "";
        return t + " · " + pos.replace(":", "–");
      }

      function scrollCodeTo(offset) {
        const line = codeEl.value.slice(0, offset).split("\n").length - 1;
        const lh = parseFloat(getComputedStyle(codeEl).lineHeight) || 22;
        const target = (line - 4) * lh;
        codeEl.scrollTop = Math.max(0, target);
      }

      let flashTimer = 0;
      function flashCode() {
        codeEl.classList.remove("flash");
        void codeEl.offsetWidth; // restart the animation
        codeEl.classList.add("flash");
        clearTimeout(flashTimer);
        flashTimer = setTimeout(() => codeEl.classList.remove("flash"), 500);
      }

      function updateCaretTag() {
        codeTag.textContent = "caret @ " + codeEl.selectionStart;
      }

      /* ------------------------------ wiring ---------------------------- */

      codeEl.addEventListener("input", () => {
        updateCaretTag();
        scheduleRender();
      });
      // Caret moves (arrow keys, clicks, selection) drive the forward sync.
      const onCaret = () => {
        updateCaretTag();
        syncFromCaret();
      };
      codeEl.addEventListener("keyup", onCaret);
      codeEl.addEventListener("click", onCaret);
      document.addEventListener("selectionchange", () => {
        if (document.activeElement === codeEl) onCaret();
      });

      themeSel.addEventListener("change", () => {
        engine = new ReTeXEngine({ theme: getTheme(themeSel.value) });
        render();
      });

      // Support tab indentation in the editor (handy for ReTeX nesting).
      codeEl.addEventListener("keydown", (e) => {
        if (e.key !== "Tab") return;
        e.preventDefault();
        const s = codeEl.selectionStart;
        const en = codeEl.selectionEnd;
        codeEl.setRangeText("  ", s, en, "end");
        scheduleRender();
      });

      codeEl.value = SAMPLE;
      updateCaretTag();
      render();
    </script>
  </body>
</html>
